# A crawl of its own in a container: docker compose run --rm crawl
# Sandboxes made for crawling practice; every key and its default is listed
# in config.example.yaml. Paths are relative to /app, ./out is /app/out.

urls:
  - https://books.toscrape.com/index.html

crawler:
  max_pages: 50
  max_depth: 2
  rate_limit: 2.0       # requests per second to a host

storage:
  outputs: [out/pages.jsonl]

report:
  stats_json: out/stats.json
  html: out/report.html
  title: Books to Scrape
