[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "async-web-crawler"
version = "0.1.0"
description = "Asynchronous web crawler built on asyncio and aiohttp"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
# Rendering of JavaScript in a headless browser; then: playwright install chromium
js = ["playwright>=1.45"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not network and not postgres and not browser'"
markers = [
    "network: tests that require real internet access (deselected by default)",
    "postgres: tests that require a PostgreSQL server, see docker-compose.yml (deselected by default)",
    "browser: tests that require Playwright and Chromium, see the js extra (deselected by default)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
