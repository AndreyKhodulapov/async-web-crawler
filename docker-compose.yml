# PostgreSQL for the crawler and its tests:
#   docker compose up -d --wait
#   export CRAWLER_DATABASE_URL=postgresql://crawler:crawler@localhost:5432/crawler
# If port 5432 is taken, export CRAWLER_POSTGRES_PORT=55432 first and put
# that port in the URL; the tests read the port from the same variable.
#
# The crawler runs in the services below, built from the Dockerfile; their
# configuration files are those of examples/docker, the files they write
# go to ./out. Each is started by its name only:
#   docker compose run --rm crawl                     # a crawl of its own
#   docker compose run --rm job                       # create the crawl job "books"
#   docker compose up --scale worker=4 worker         # its workers, until no page is left
#   docker compose run --rm job status --job books    # its progress
#   docker compose run --rm job report --job books --report out/report.html
# CRAWLER_JOB names another job for the workers. CRAWLER_TARGET=js runs
# them in the image with Chromium, for a job whose pages are rendered. On
# Linux, create ./out first and export CRAWLER_USER=$(id -u):$(id -g), so
# that they can write there.

x-crawler: &crawler
  build:
    context: .
    target: ${CRAWLER_TARGET:-crawler}
  image: async-web-crawler:${CRAWLER_TARGET:-latest}
  init: true  # passes signals on and reaps the processes a browser leaves behind
  shm_size: 1g  # Chromium needs more shared memory than the 64 MB of a container
  user: "${CRAWLER_USER:-10001:10001}"
  environment:
    CRAWLER_DATABASE_URL: postgresql://crawler:crawler@postgres:5432/crawler
  volumes:
    - ./examples/docker:/config:ro
    - ./out:/app/out
  # docker stop sends SIGTERM: the crawler writes what its storage buffers
  # and its reports, and a worker queues its pages in progress again.
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
      POSTGRES_DB: crawler
    # The password is only for a local run: the port is open to this host alone.
    ports:
      - "127.0.0.1:${CRAWLER_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawler"]
      interval: 2s
      timeout: 3s
      retries: 15

  crawl:
    <<: *crawler
    profiles: [crawl]
    command: ["--config", "/config/crawl.yaml"]

  job:
    <<: *crawler
    profiles: [job]
    command: ["job", "create", "--config", "/config/job.yaml", "--name", "${CRAWLER_JOB:-books}"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *crawler
    profiles: [job]
    command: ["worker", "--job", "${CRAWLER_JOB:-books}", "--config", "/config/worker.yaml"]
    # A worker the database failed (exit code 1) starts again and takes up
    # the job; the pages it had in progress come back once their leases expire.
    # No limit: Docker waits up to a minute between the starts, so a restart of
    # PostgreSQL is ridden out. A worker that ends with its job (exit code 0)
    # or is stopped is not started again; one with a wrong configuration
    # (exit code 2) is, every minute, until it is fixed.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
