# Example configuration of the crawler. Every key is optional: the values
# here are the defaults, except for `urls`. Copy the file to config.yaml and
# keep what you change. Times are in seconds; paths are relative to the
# working directory.

# Start URLs of the crawl.
urls:
  - https://example.com/

# Sitemaps whose pages are crawled along with the start URLs.
sitemaps:
  urls: []              # e.g. [https://example.com/sitemap.xml]
  from_robots: false    # also the sitemaps named in robots.txt of the start URLs' sites
  max_urls: 50000       # pages taken from one sitemap, its index included

crawler:
  max_pages: 100        # pages requested, failed ones included
  max_pages_per_host: null  # pages requested from one host; null for no limit of its own
  max_depth: 2          # links followed from a start URL; 0 crawls only the start URLs
  max_concurrent: 10    # requests in flight
  max_per_domain: null  # requests in flight to one host; null for no limit of its own
  rate_limit: 1.0       # requests per second; null lifts the limit
  per_domain_rate: true # the rate limit is for each host, not for all of them together
  min_delay: 0.0        # pause between two requests to a host
  jitter: 0.0           # random addition to the pause, up to this much
  respect_robots: true  # robots.txt, and nofollow / noindex of pages and links
  user_agent: "AsyncWebCrawler/0.1 (+https://github.com/AndreyKhodulapov/async-web-crawler)"
  user_agents: []       # variants to rotate; each starts with the same name as user_agent
  total_timeout: 30.0
  connect_timeout: 10.0
  read_timeout: 20.0
  timeout_growth: 1.5   # the timeouts grow by this factor on every retry
  max_page_size: 3145728  # bytes; a larger page fails unread; null lifts the limit
  max_parsing: 2        # pages parsed at once; parsing takes about 40 times the page size in memory
  max_retry_after: 600.0  # the longest wait a Retry-After header is obeyed for
  keep_pages: true      # false: a page is dropped from memory once it is saved, for large crawls

# Repeated attempts of a request that failed for a while.
retry:
  max_retries: 3
  backoff_factor: 2.0   # the delay grows by this factor on every attempt
  base_delay: 1.0
  max_delay: 30.0

# Stops asking a host that keeps failing.
circuit_breaker:
  failure_threshold: 0.5  # share of failed requests that opens the circuit; null turns it off
  min_requests: 5         # requests in the window before the share counts
  window: 60.0
  cooldown: 30.0          # how long the host is left alone

# Which links to follow. The patterns are regular expressions searched
# anywhere in the URL; quote them with single quotes.
filters:
  same_domain_only: true  # links to other hosts are not followed
  include: []           # e.g. ['^https://example\.com/blog/']
  exclude: []           # e.g. ['\.pdf$', '/login']
  # Links to files with these extensions are not followed; [] follows them all.
  exclude_extensions: [pdf, doc, docx, xls, xlsx, ppt, pptx,
                       jpg, jpeg, png, gif, webp, svg, ico,
                       zip, gz, tar, rar, 7z,
                       mp3, mp4, avi, mov, webm,
                       exe, dmg, iso,
                       css, js]

# Cookies and headers of the requests. Their values are secrets: they stay
# out of the log, the summary and the reports, so keep this file private too.
session:
  keep_cookies: true    # send back the cookies sites set; false keeps none, so no site can keep a session
  # Cookies sent from the first request, each to its own domain only:
  # example.com is that host, .example.com the host and its subdomains.
  cookies: []           # e.g. [{name: sessionid, value: "...", domain: example.com, path: /, secure: true}]
  cookies_file: null    # e.g. cookies.txt, in the Netscape format browser extensions and curl -c export
  save_cookies: null    # e.g. cookies.txt; written after the crawl, readable by its owner only
  # Sent with every request to every host, robots.txt and redirects to other
  # sites included; User-Agent, Cookie and Host have keys of their own.
  headers: {}           # e.g. {Accept-Language: en, Authorization: "Bearer ..."}

# Proxies the requests go through; without any, requests go directly.
# robots.txt, rate limits and max_per_domain still go by the host of the site.
proxy:
  urls: []              # e.g. ["http://user:password@proxy-1.example:3128", "http://proxy-2.example:3128"]
  rotation: per_host    # per_host: a host always goes through one proxy; per_request: the proxies take turns
  from_env: false       # true takes HTTP_PROXY, HTTPS_PROXY and NO_PROXY instead of urls
  max_failures: 3       # failures in a row that take a proxy out of rotation
  cooldown: 60.0        # seconds a proxy stays out of rotation

# Pages rendered in a headless Chromium, for sites whose links and text
# JavaScript makes. Needs playwright install chromium.
# The page itself is downloaded as without a browser; the browser loads its
# scripts, styles and data, which robots.txt is not asked about.
rendering:
  mode: "off"           # always: every HTML page; patterns: the pages of include; quote "off"
  include: []           # with mode: patterns, e.g. ['^https://example\.com/app/']
  wait_until: load      # load, domcontentloaded or networkidle (no request for half a second)
  wait_for: null        # a CSS selector to wait for after that, e.g. "#content"
  timeout: 30.0         # the browser's time for a page, the waits included
  max_open_pages: 2     # pages rendered at once; a browser tab takes 50 to 100 MB
  block_resources: [image, font, media]  # requests the browser does not make

# Where the crawled pages are saved: files, by extension (.jsonl, .json,
# .csv, .db), or database URLs (sqlite:///pages.db, postgresql://...).
# "{worker}" in a file name is the name of the worker of a crawl job, and
# "local" in a crawl of its own: every worker writes a file of its own.
storage:
  outputs: []           # e.g. [pages.jsonl, pages.csv]
  batch_size: 100       # pages written at once
  csv_encoding: utf-8   # utf-8-sig for Excel
  overwrite: false      # true starts the files anew; false adds to them (databases keep a row per URL)

logging:
  level: INFO           # DEBUG, INFO, WARNING, ERROR or CRITICAL
  file: null            # e.g. crawler.log; the log goes to the console either way
  max_bytes: 10485760   # the file is rotated at this size; 0 never rotates it
  backup_count: 5       # rotated files that are kept; 0 never rotates the file

# Files the statistics are written to after the crawl.
report:
  stats_json: null      # e.g. stats.json
  html: null            # e.g. report.html
  title: Crawl report
  top_domains: 10       # hosts listed in the statistics

# The workers of a crawl job: the database they share and how they hold
# their pages. Each worker has its own; a crawl of its own ignores them.
distributed:
  database_url: null    # postgresql://user:password@host:5432/database; null: CRAWLER_DATABASE_URL
  lease_seconds: 60.0   # a page of a worker that stopped is crawled again after this long
  heartbeat_seconds: 20.0  # how often a worker renews the leases of its pages; less than lease_seconds
  max_attempts: 3       # leases of a page that may expire before it fails
  poll_interval: 1.0    # how often a worker with no page looks for one at least
